name: Deploy slides to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"   # only needed for PDF/PPTX export
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # One folder per deck. --base must match the URL path: /<repo>/<folder>/
      - run: npx slidev build gregory-atoc.md    --base /slidev_talks/gregory/    --out _site/gregory
      - run: npx slidev build gregory-lecture.md --base /slidev_talks/gregory-cu/ --out _site/gregory-cu
      - run: npx slidev build camulator-aigeo.md --base /slidev_talks/camulator-aigeo/ --out _site/camulator-aigeo
      - run: npx slidev build camulator-coupling.md --base /slidev_talks/camulator-coupling/ --out _site/camulator-coupling
      - run: cp site/index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
